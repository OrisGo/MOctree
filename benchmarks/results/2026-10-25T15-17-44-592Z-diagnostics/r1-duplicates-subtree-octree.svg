<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" onload="init()">
<defs>
<linearGradient id="background" y1="0" y2="1" x1="0" x2="0">
<stop stop-color="#eeeeee" offset="5%"/>
<stop stop-color="#eeeeb0" offset="95%"/>
</linearGradient>
