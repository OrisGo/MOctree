<!doctype html>
<html lang="zh"><meta charset="utf-8"><title>子树实际内容边界实验</title>
<h1>子树实际内容边界实验</h1><p id="status">就绪</p><pre id="result"></pre>
<script type="module">
import {runContent} from './content.mjs';
window.octreeBench={start:async(options)=>{
  const result=await runContent(options,s=>document.querySelector('#status').textContent=s);
  document.querySelector('#status').textContent='完成';
  document.querySelector('#result').textContent=JSON.stringify({rows:result.rows.length,acceptance:result.acceptance},null,2);
  return result;
}};
</script></html>
